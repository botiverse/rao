# Electron + electron-builder work best with a flat node_modules layout.
nodeLinker: hoisted

# pnpm blocks dependency lifecycle scripts by default; these are the ones we allow to run.
allowBuilds:
  electron: true
  electron-builder: true
  electron-winstaller: true
  esbuild: true
  "@google/genai": false
  protobufjs: false

# Supply-chain policy: refuse packages younger than a day unless listed here.
minimumReleaseAgeExclude:
  - "@botiverse/oar"
